name: glidly-backtest

on:
  schedule:
    - cron: "23 2 * * 1" # weekly, Monday 02:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run 7-day shadow backtest
        env:
          TRON_HTTP_ENDPOINTS: ${{ secrets.TRON_HTTP_ENDPOINTS || 'https://api.trongrid.io' }}
          TRON_EVENT_ENDPOINTS: ${{ secrets.TRON_EVENT_ENDPOINTS || 'https://api.trongrid.io' }}
          TRON_RPC_MIN_INTERVAL_MS: "250"
          TRON_RPC_TIMEOUT_MS: "30000"
        run: npx tsx src/backtest.ts
      - name: Commit report
        run: |
          git config user.name "glidly-bot"
          git config user.email "glidly-bot@users.noreply.github.com"
          git add data/backtest-latest.json || true
          git diff --cached --quiet || git commit -m "backtest: weekly refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push
